name: Build PvPCoreVIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle
        run: mvn -B package

      - name: Jar'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: PvPCoreVIP
          path: target/PvPCoreVIP-1.0.0.jar
          
